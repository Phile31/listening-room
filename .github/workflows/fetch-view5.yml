name: Fetch current View 5
on:
  push:
    paths:
      - '.github/workflows/fetch-view5.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current View 5
        run: |
          curl -L --fail 'https://i.imgur.com/hoN9jR2_d.webp?maxwidth=760&fidelity=grand' -o gallery-view-05-current.webp
      - name: Commit source image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery-view-05-current.webp
          git commit -m 'Import current gallery view 5 source'
          git push
